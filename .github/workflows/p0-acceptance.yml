name: P0 participant check-in acceptance
on:
  push:
    branches: [main, p0-participant-checkin]
    paths: ['docs/**', 'tests/p0*', '.github/workflows/p0-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact public source
        run: |
          curl -fLsS --retry 2 "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" -o /tmp/source.tgz
          tar -xzf /tmp/source.tgz --strip-components=1
      - name: Archive public source for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-public-source
          path: |
            docs/
            tests/
          retention-days: 2
      - name: Verify JavaScript syntax
        run: find docs/assets -name '*.js' -exec node --check {} \;
      - name: Install pinned browser testing tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Read-only live deployed-site acceptance
        run: node tests/p0-live.cjs
      - name: Save acceptance report without credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-acceptance-report
          path: p0-report/
          retention-days: 7
          if-no-files-found: ignore
