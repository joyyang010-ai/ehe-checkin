name: Account recovery and approval checks
on:
  push:
    branches: [main, account-help-v117]
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact public source
        run: |
          curl --fail --silent --show-error --location "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA" -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1
      - name: Verify JavaScript syntax
        run: |
          node --check docs/assets/account.js
          node --check docs/assets/account-access.js
          node --check docs/assets/account-route.js
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Synthetic account tests - no production credentials or writes
        run: python tests/account-flows.py
      - name: Inspect public Auth settings and authorization without sending email
        run: node tests/account-live.cjs
      - name: Save verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-help-verification
          retention-days: 7
          path: |
            account-report/
            docs/
