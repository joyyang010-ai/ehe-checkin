name: EHE UI alignment and desk smoke tests
on:
  push:
    branches: [main, privacy-access-v14]
    paths: ['docs/**', 'tests/**', '.github/workflows/ui-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact public source commit
        run: |
          curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" -o source.tgz
          mkdir source
          tar -xzf source.tgz --strip-components=1 -C source
      - name: Install pinned browser test dependency
        working-directory: source
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Check JavaScript syntax
        working-directory: source
        run: |
          for f in docs/assets/*.js tests/*.cjs; do node --check "$f"; done
      - name: Test mocked UI without accessing real participant data
        working-directory: source
        run: |
          node tests/ui-audit.cjs
          node tests/workflow-routes.cjs
          node tests/privacy-access.cjs
      - name: Save synthetic-data screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ehe-ui-audit
          path: |
            source/ui-audit/
            source/docs/
            source/tests/
          retention-days: 7
          if-no-files-found: ignore
