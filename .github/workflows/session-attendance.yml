name: Session attendance read-only view
on:
  push:
    branches: [main, session-attendance-v116]
    paths: ['docs/**', 'tests/session-attendance*', '.github/workflows/session-attendance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact public source
        run: |
          curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" -o source.tgz
          mkdir source
          tar -xzf source.tgz --strip-components=1 -C source
      - name: Syntax and deterministic identity tests
        working-directory: source
        run: |
          node --check docs/assets/session-attendance.js
          node tests/session-attendance-model.cjs
      - name: Install pinned browser testing dependency
        working-directory: source
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install --with-deps chromium webkit
      - name: Synthetic browser tests; no production sign-in or writes
        working-directory: source
        run: node tests/session-attendance-ui.cjs
      - name: Verify actual published site without credentials or writes
        if: github.ref == 'refs/heads/main'
        working-directory: source
        run: node tests/session-attendance-live.cjs
      - name: Save evidence and public source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-attendance-verification
          path: |
            source/session-attendance-report/
            source/docs/
            source/tests/session-attendance*
          retention-days: 7
