name: Live volunteer entry and authorization checks
on:
  push:
    branches: [main]
    paths: ['docs/**', 'tests/live-entry-archive.cjs', '.github/workflows/live-entry-archive.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-volunteer-entry
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact public source
        run: |
          curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" -o source.tgz
          mkdir source
          tar -xzf source.tgz --strip-components=1 -C source
      - name: Install pinned browser tools
        working-directory: source
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install --with-deps chromium webkit
      - name: Verify real deployed entry and deny unauthorized writes
        working-directory: source
        run: node tests/live-entry-archive.cjs
      - name: Store non-sensitive live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-volunteer-entry-v16
          path: source/live-v16/
          retention-days: 7
          if-no-files-found: error
